<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#e4eef8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="540" fill="url(#bg)"/>
  <!-- 电路纹理（右上角，10% 透明度） -->
  <g stroke="#1b3a5c" stroke-width="3" fill="none" opacity="0.1">
    <path d="M820 60 H980 V160 H1140 V300"/>
    <path d="M880 480 H1060 V360 H1200"/>
    <path d="M1160 60 V140"/>
    <path d="M920 300 H1040 V420"/>
    <circle cx="1200" cy="300" r="8" fill="#1b3a5c" stroke="none"/>
    <circle cx="1160" cy="60" r="8" fill="#1b3a5c" stroke="none"/>
    <circle cx="1040" cy="420" r="8" fill="#1b3a5c" stroke="none"/>
  </g>

  <!-- 左：标题区 -->
  <text x="88" y="150" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="64" font-weight="bold" fill="#12283f">引脚网络重排</text>
  <text x="88" y="216" font-family="'Microsoft YaHei', sans-serif" font-size="30" fill="#33506e">选中网络 · 自动求解最优引脚分配 · 鼠线交叉最少</text>
  <g font-family="'Microsoft YaHei', sans-serif" font-size="24" fill="#3d5a7a">
    <text x="88" y="300">匈牙利算法 + 2-opt 精修，排插 / MCU / FPGA 任选一侧</text>
    <text x="88" y="344">真鼠线即预览，满意同步原理图，一键撤销</text>
  </g>

  <!-- 右：交叉→理顺示意 -->
  <g transform="translate(760,150)">
    <!-- 左右两块芯片 -->
    <g>
      <rect x="0" y="20" width="86" height="200" rx="8" fill="#dce8f4" stroke="#8fb0d4" stroke-width="3"/>
      <rect x="274" y="20" width="86" height="200" rx="8" fill="#dce8f4" stroke="#8fb0d4" stroke-width="3"/>
      <g fill="#c9a227">
        <rect x="82" y="38" width="20" height="14"/><rect x="82" y="85" width="20" height="14"/>
        <rect x="82" y="132" width="20" height="14"/><rect x="82" y="179" width="20" height="14"/>
        <rect x="258" y="38" width="20" height="14"/><rect x="258" y="85" width="20" height="14"/>
        <rect x="258" y="132" width="20" height="14"/><rect x="258" y="179" width="20" height="14"/>
      </g>
    </g>
    <!-- 旧交叉线 -->
    <g stroke="#e05252" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M102 45 C160 45, 200 186, 258 186"/>
      <path d="M102 92 H258"/>
      <path d="M102 139 H258"/>
      <path d="M102 186 C160 186, 200 45, 258 45"/>
    </g>
    <!-- 新直线 -->
    <g stroke="#1e9e5a" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M102 45 H258"/><path d="M102 92 H258"/>
      <path d="M102 139 H258"/><path d="M102 186 H258"/>
    </g>
    <!-- 箭头 -->
    <path d="M320 110 h44 m-14 -14 l14 14 -14 14" stroke="#12283f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

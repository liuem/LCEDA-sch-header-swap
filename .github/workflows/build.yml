name: Build
# push/PR：lint + 离线测试 + 构建 .eext + bundle 冒烟；打 v* 标签时自动发布 Release 并附带安装包
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 允许 GITHUB_TOKEN 创建 Release（默认只读会导致发版步骤失败）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: node test/run-offline.ts
      - run: npm run build
      - run: npm run test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: eext-package
          path: build/dist/*.eext
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.eext
          generate_release_notes: true
